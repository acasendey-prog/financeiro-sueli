<!-- Aplica o fundo escolhido antes da primeira pintura. Sem isto, quem
     escolheu escuro vê um lampejo branco a cada abertura. -->
<script>
  try {
    var t = localStorage.getItem('bairro.tema');
    if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t;
  } catch (e) { /* aba anônima: segue o aparelho */ }
</script>
